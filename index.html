<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Juego de Memoria - Parejas de Emojis</title>

    <link rel="stylesheet" href="style.css">

  </head>
  <body>
      <div class="game-container">
        <div class="info-panel">
          <div class="stats">
            <p>INTENTOS <span id="movesCount">0</span></p>
          </div>

          <button id="resetGameBtn">REINICIAR</button>
        </div>

        <div class="grid" id="memoryGrid"></div>
        <div
          id="winMessage"
          style="
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 50px;
          "
        ></div>
      </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
